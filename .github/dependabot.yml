version: 2
updates:
  # Maintain Go daemon dependencies
  - package-ecosystem: "gomod"
    directory: "/daemon"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      go-minor-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]

  # Maintain Android module Gradle dependencies
  - package-ecosystem: "gradle"
    directory: "/android-module"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      gradle-minor-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]

  # Maintain GitHub Actions versions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
